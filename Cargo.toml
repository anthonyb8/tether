[package]
name = "tether"
version = "0.0.1"
edition = "2024"
description = "Your laptop and phone, tethered to the box your code runs on"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[profile.release]
strip = true
